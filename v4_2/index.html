const STORAGE_KEY = 'iso27001_audit_data_v4';

// Debounced Text Input Component
const DebouncedTextarea = memo(({ value, onChange, placeholder, rows, className }) => {
  const [localValue, setLocalValue] = useState(value || '');
  const timeoutRef = useRef(null);

  useEffect(() => {
    setLocalValue(value || '');
  }, [value]);

  const handleChange = (e) => {
    const newValue = e.target.value;
    setLocalValue(newValue);
    if (timeoutRef.current) clearTimeout(timeoutRef.current);
    timeoutRef.current = setTimeout(() => onChange(newValue), 500);
  };

  const handleBlur = () => {
    if (timeoutRef.current) clearTimeout(timeoutRef.current);
    onChange(localValue);
  };

  return (
    <textarea className={className} rows={rows} placeholder={placeholder}
      value={localValue} onChange={handleChange} onBlur={handleBlur} />
  );
});

const DebouncedInput = memo(({ value, onChange, placeholder, type = "text", className }) => {
  const [localValue, setLocalValue] = useState(value || '');
  const timeoutRef = useRef(null);

  useEffect(() => {
    setLocalValue(value || '');
  }, [value]);

  const handleChange = (e) => {
    const newValue = e.target.value;
    setLocalValue(newValue);
    if (timeoutRef.current) clearTimeout(timeoutRef.current);
    timeoutRef.current = setTimeout(() => onChange(newValue), 500);
  };

  const handleBlur = () => {
    if (timeoutRef.current) clearTimeout(timeoutRef.current);
    onChange(localValue);
  };

  return (
    <input type={type} className={className} placeholder={placeholder}
      value={localValue} onChange={handleChange} onBlur={handleBlur} />
  );
});

function App() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [apiKey, setApiKey] = useState('');
  const [assessments, setAssessments] = useState({});
  const [auditInfo, setAuditInfo] = useState({
    organizationName: '', auditorName: '', auditDate: new Date().toISOString().split('T')[0], auditScope: ''
  });
  const [selectedControlId, setSelectedControlId] = useState(null);
  const [aiRecommendation, setAiRecommendation] = useState('');
  const [isLoading, setIsLoading] = useState(false);
  const [filterTheme, setFilterTheme] = useState('all');
  const [saveStatus, setSaveStatus] = useState('');
  const [showSavePanel, setShowSavePanel] = useState(false);

  const selectedControl = selectedControlId 
    ? [...clausesData, ...annexAData].find(c => c.id === selectedControlId) 
    : null;

  // Load from localStorage
  useEffect(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        if (data.assessments) setAssessments(data.assessments);
        if (data.auditInfo) setAuditInfo(data.auditInfo);
        if (data.apiKey) setApiKey(data.apiKey);
        setSaveStatus('✓ Loaded'); setTimeout(() => setSaveStatus(''), 2000);
      }
    } catch (e) { console.error('Load error:', e); }
  }, []);

  // Auto-save with debounce
  const saveTimeoutRef = useRef(null);
  useEffect(() => {
    if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(() => {
      const data = { assessments, auditInfo, apiKey, lastSaved: new Date().toISOString() };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }, 1000);
  }, [assessments, auditInfo, apiKey]);

  // CORRECTED SCORING LOGIC
  const calculateScore = useCallback((id) => {
    const a = assessments[id];
    if (!a || a.baseScore === undefined) return 0;
    
    let score = a.baseScore; // Base: 0, 1, or 2
    
    // Level 3 criteria unlocks at base score 2
    if (score >= 2) {
      const l3Count = level3Criteria.filter(c => a[c.id]).length;
      score = 2 + (l3Count * 0.25); // 2.00 -> 2.25 -> 2.50 -> 2.75 -> 3.00
      
      // Level 4 criteria unlocks when ALL Level 3 criteria are met (score = 3.00)
      if (l3Count === 4) {
        const l4Count = level4Criteria.filter(c => a[c.id]).length;
        score = 3 + (l4Count * 0.25); // 3.00 -> 3.25 -> 3.50 -> 3.75 -> 4.00
      }
    }
    
    return Math.min(score, 4);
  }, [assessments]);

  const updateAssessment = useCallback((id, field, value) => {
    setAssessments(prev => {
      // Only update if value actually changed
      if (prev[id]?.[field] === value) return prev;
      return {
        ...prev,
        [id]: { ...prev[id], [field]: value, lastModified: new Date().toISOString() }
      };
    });
  }, []);

  const exportJSON = () => {
    const data = { version: '4.0', exportDate: new Date().toISOString(), auditInfo, assessments };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `ISO27001_Audit_${auditInfo.organizationName || 'Export'}_${new Date().toISOString().split('T')[0]}.json`;
    a.click(); URL.revokeObjectURL(url);
    setSaveStatus('✓ Exported');
  };

  const exportCSV = () => {
    const all = [...clausesData.map(c => ({...c, type: 'Clause'})), ...annexAData.map(c => ({...c, type: 'Annex'}))];
    const headers = ['Type','ID','Name','Theme','BaseScore','FinalScore',
      'L3_Justification','L3_PolicyImplemented','L3_Repeatable','L3_ImprovementCycle',
      'L4_KPIsDefined','L4_KPIStrategy','L4_KPIReview','L4_RootCauseAnalysis',
      'EvidenceNotes','EvidenceFiles','AuditorNotes'];
    const rows = all.map(c => {
      const a = assessments[c.id] || {};
      return [c.type, c.id, `"${c.name}"`, c.theme||'', a.baseScore||0, calculateScore(c.id).toFixed(2),
        a.l3_1?'Y':'N', a.l3_2?'Y':'N', a.l3_3?'Y':'N', a.l3_4?'Y':'N',
        a.l4_1?'Y':'N', a.l4_2?'Y':'N', a.l4_3?'Y':'N', a.l4_4?'Y':'N',
        `"${(a.evidenceNotes||'').replace(/"/g,'""')}"`,
        `"${(a.evidenceFiles||'').replace(/"/g,'""')}"`,
        `"${(a.auditorNotes||'').replace(/"/g,'""')}"`
      ].join(',');
    });
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    a.download = `ISO27001_Audit_${auditInfo.organizationName || 'Export'}_${new Date().toISOString().split('T')[0]}.csv`;
    a.click(); URL.revokeObjectURL(url);
    setSaveStatus('✓ CSV Exported');
  };

  const importJSON = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.assessments) setAssessments(data.assessments);
        if (data.auditInfo) setAuditInfo(data.auditInfo);
        setSaveStatus('✓ Imported');
      } catch { alert('Invalid file format'); }
    };
    reader.readAsText(file); e.target.value = '';
  };

  const clearAll = () => {
    if (confirm('Clear ALL data? This cannot be undone.')) {
      setAssessments({}); 
      setAuditInfo({ organizationName: '', auditorName: '', auditDate: new Date().toISOString().split('T')[0], auditScope: '' });
      localStorage.removeItem(STORAGE_KEY); 
      setSaveStatus('✓ Cleared');
    }
  };

  const getAI = async (ctrl) => {
    if (!apiKey) { alert('Enter API key first'); return; }
    setIsLoading(true); setAiRecommendation('');
    const a = assessments[ctrl.id] || {};
    const score = calculateScore(ctrl.id);
    const l3Met = level3Criteria.filter(c => a[c.id]).map(c => c.label);
    const l3Missing = level3Criteria.filter(c => !a[c.id]).map(c => c.label);
    const l4Met = level4Criteria.filter(c => a[c.id]).map(c => c.label);
    const l4Missing = level4Criteria.filter(c => !a[c.id]).map(c => c.label);
    
    const prompt = `As an ISO 27001:2022 auditor assistant, analyze this control assessment:

Control ID: ${ctrl.id}
Control Name: ${ctrl.name}
${ctrl.description ? `Description: ${ctrl.description}` : ''}
${ctrl.theme ? `Theme: ${ctrl.theme}` : ''}

Current Assessment:
- Base Score: ${a.baseScore || 0}/2
- Final Score: ${score.toFixed(2)}/4
- Evidence Notes: ${a.evidenceNotes || 'None provided'}
- Evidence Files: ${a.evidenceFiles || 'None listed'}
- Auditor Notes: ${a.auditorNotes || 'None'}

Level 3 Criteria Met: ${l3Met.length > 0 ? l3Met.join('; ') : 'None'}
Level 3 Criteria Missing: ${l3Missing.length > 0 ? l3Missing.join('; ') : 'All met'}
Level 4 Criteria Met: ${l4Met.length > 0 ? l4Met.join('; ') : 'None'}
Level 4 Criteria Missing: ${l4Missing.length > 0 ? l4Missing.join('; ') : 'All met'}

Please provide:
1. **Gap Analysis**: What's missing to reach the next level?
2. **Specific Actions**: 3-5 concrete steps to improve this control
3. **Evidence Suggestions**: What documentation would demonstrate compliance?
4. **Quick Wins**: Any easy improvements that can be made immediately?
5. **Risk Consideration**: What risks exist at the current maturity level?`;

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1500, messages: [{ role: 'user', content: prompt }] })
      });
      const data = await res.json();
      const rec = data.error ? `Error: ${data.error.message}` : data.content[0].text;
      setAiRecommendation(rec);
      updateAssessment(ctrl.id, 'aiRecommendation', rec);
    } catch (err) { setAiRecommendation(`Error: ${err.message}`); }
    setIsLoading(false);
  };

  const getColor = (s) => s >= 4 ? 'bg-green-600' : s >= 3.5 ? 'bg-green-500' : s >= 3 ? 'bg-lime-500' : s >= 2.5 ? 'bg-yellow-500' : s >= 2 ? 'bg-yellow-400' : s >= 1 ? 'bg-orange-500' : 'bg-red-500';

  const stats = useCallback((data) => {
    const assessed = data.filter(i => assessments[i.id]?.baseScore !== undefined);
    const scores = assessed.map(i => calculateScore(i.id));
    return { 
      total: data.length, 
      assessed: assessed.length, 
      avg: scores.length ? (scores.reduce((a,b) => a+b, 0) / scores.length) : 0, 
      l3: scores.filter(s => s >= 3).length, 
      l4: scores.filter(s => s >= 4).length 
    };
  }, [assessments, calculateScore]);

  const allStats = stats([...clausesData, ...annexAData]);
  const filteredAnnex = filterTheme === 'all' ? annexAData : annexAData.filter(c => c.theme === filterTheme);

  const ControlCard = memo(({ ctrl, isSelected, score, hasEvidence, onSelect }) => {
    return (
      <div onClick={() => onSelect(ctrl.id)} 
        className={`border rounded-lg p-3 mb-2 cursor-pointer transition-all ${isSelected ? 'border-blue-500 bg-blue-50 shadow-md' : 'border-gray-200 hover:border-gray-400'}`}>
        <div className="flex justify-between items-start">
          <div className="flex-1">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="font-mono text-xs bg-gray-100 px-2 py-0.5 rounded">{ctrl.id}</span>
              {ctrl.theme && <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">{ctrl.theme}</span>}
              {hasEvidence && <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">📎</span>}
            </div>
            <h3 className="font-medium text-sm mt-1">{ctrl.name}</h3>
          </div>
          <span className={`${getColor(score)} text-white px-2 py-1 rounded text-sm font-bold ml-2`}>{score.toFixed(2)}</span>
        </div>
      </div>
    );
  });

  const AssessmentPanel = () => {
    if (!selectedControl) {
      return <div className="bg-gray-50 rounded-lg p-8 text-center text-gray-400">Select a control to assess</div>;
    }

    const ctrl = selectedControl;
    const a = assessments[ctrl.id] || {};
    const score = calculateScore(ctrl.id);
    const showL3 = (a.baseScore || 0) >= 2;
    const allL3Met = level3Criteria.every(c => a[c.id]);
    const showL4 = showL3 && allL3Met;

    return (
      <div className="bg-white rounded-lg border p-4 space-y-4">
        <div className="flex justify-between items-start">
          <div>
            <span className="font-mono text-sm bg-gray-100 px-2 py-1 rounded">{ctrl.id}</span>
            <h2 className="text-lg font-bold mt-1">{ctrl.name}</h2>
            {ctrl.description && <p className="text-sm text-gray-600">{ctrl.description}</p>}
          </div>
          <div className="text-right">
            <div className="text-2xl font-bold">{score.toFixed(2)}</div>
            <div className="text-xs text-gray-400">/ 4.00</div>
          </div>
        </div>

        <div className="w-full bg-gray-200 rounded-full h-3">
          <div className={`h-3 rounded-full transition-all ${getColor(score)}`} style={{width: `${(score/4)*100}%`}}></div>
        </div>

        {/* Base Score Selection */}
        <div>
          <label className="block font-medium text-sm mb-2">Base Maturity Level (0-2)</label>
          <div className="grid grid-cols-3 gap-2">
            {[
              { value: 0, label: "0 - Non-Existent", desc: "No control exists" },
              { value: 1, label: "1 - Initial", desc: "Ad-hoc, undocumented" },
              { value: 2, label: "2 - Developing", desc: "Partially documented" },
            ].map(opt => (
              <button key={opt.value} onClick={() => updateAssessment(ctrl.id, 'baseScore', opt.value)}
                className={`p-3 rounded border text-left transition-all ${a.baseScore === opt.value ? 'border-blue-500 bg-blue-50 ring-2 ring-blue-200' : 'border-gray-200 hover:border-gray-400'}`}>
                <div className="font-bold text-sm">{opt.value}</div>
                <div className="text-xs text-gray-500">{opt.desc}</div>
              </button>
            ))}
          </div>
        </div>

        {/* Level 3 Criteria */}
        {showL3 && (
          <div className="p-4 bg-yellow-50 rounded-lg border border-yellow-300">
            <div className="flex justify-between items-center mb-3">
              <h3 className="font-semibold text-yellow-800">Level 3 Criteria (+0.25 each)</h3>
              <span className="text-sm bg-yellow-200 text-yellow-800 px-2 py-1 rounded">
                {level3Criteria.filter(c => a[c.id]).length}/4 met
              </span>
            </div>
            {level3Criteria.map(c => (
              <label key={c.id} className="flex items-start gap-3 mb-2 cursor-pointer">
                <input type="checkbox" checked={a[c.id] || false} 
                  onChange={e => updateAssessment(ctrl.id, c.id, e.target.checked)} 
                  className="mt-1 w-5 h-5 rounded border-yellow-400 text-yellow-600 focus:ring-yellow-500" />
                <span className="text-sm">{c.label}</span>
              </label>
            ))}
            {!allL3Met && (
              <p className="text-xs text-yellow-700 mt-2 italic">
                ✓ Complete all 4 criteria to unlock Level 4
              </p>
            )}
          </div>
        )}

        {/* Level 4 Criteria */}
        {showL4 && (
          <div className="p-4 bg-green-50 rounded-lg border border-green-300">
            <div className="flex justify-between items-center mb-3">
              <h3 className="font-semibold text-green-800">Level 4 Criteria (+0.25 each)</h3>
              <span className="text-sm bg-green-200 text-green-800 px-2 py-1 rounded">
                {level4Criteria.filter(c => a[c.id]).length}/4 met
              </span>
            </div>
            {level4Criteria.map(c => (
              <label key={c.id} className="flex items-start gap-3 mb-2 cursor-pointer">
                <input type="checkbox" checked={a[c.id] || false} 
                  onChange={e => updateAssessment(ctrl.id, c.id, e.target.checked)} 
                  className="mt-1 w-5 h-5 rounded border-green-400 text-green-600 focus:ring-green-500" />
                <span className="text-sm">{c.label}</span>
              </label>
            ))}
          </div>
        )}

        {/* Evidence Section */}
        <div className="p-4 bg-blue-50 rounded-lg border border-blue-200">
          <h3 className="font-semibold text-blue-800 text-sm mb-3">📎 Evidence Documentation</h3>
          <div className="mb-3">
            <label className="block text-xs text-gray-600 mb-1">Evidence Notes</label>
            <DebouncedTextarea
              className="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
              rows={4}
              placeholder="Document evidence observations, findings, interviews conducted..."
              value={a.evidenceNotes || ''}
              onChange={(val) => updateAssessment(ctrl.id, 'evidenceNotes', val)}
            />
          </div>
          <div>
            <label className="block text-xs text-gray-600 mb-1">Evidence File References</label>
            <DebouncedInput
              className="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
              placeholder="e.g., Policy_v2.1.pdf, Risk_Register.xlsx, Screenshot_001.png"
              value={a.evidenceFiles || ''}
              onChange={(val) => updateAssessment(ctrl.id, 'evidenceFiles', val)}
            />
          </div>
        </div>

        {/* Auditor Notes */}
        <div>
          <label className="block font-medium text-sm mb-1">Auditor Notes / Recommendations</label>
          <DebouncedTextarea
            className="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-gray-400"
            rows={3}
            placeholder="Additional notes, recommendations, follow-up items..."
            value={a.auditorNotes || ''}
            onChange={(val) => updateAssessment(ctrl.id, 'auditorNotes', val)}
          />
        </div>

        {/* AI Button */}
        <button onClick={() => getAI(ctrl)} disabled={isLoading || !apiKey}
          className={`w-full py-3 rounded-lg font-medium text-sm ${apiKey ? 'bg-gradient-to-r from-purple-600 to-blue-600 text-white hover:opacity-90' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
          {isLoading ? '⏳ Analyzing...' : '🤖 Get AI Recommendations'}
        </button>

        {!apiKey && <p className="text-xs text-gray-500 text-center">Enter API key in Dashboard to enable AI</p>}

        {(aiRecommendation || a.aiRecommendation) && (
          <div className="p-4 bg-gradient-to-br from-purple-50 to-blue-50 rounded-lg border border-purple-200">
            <h3 className="font-semibold text-purple-800 text-sm mb-2">🤖 AI Recommendations</h3>
            <div className="text-sm whitespace-pre-wrap text-gray-700">{aiRecommendation || a.aiRecommendation}</div>
          </div>
        )}

        {a.lastModified && <p className="text-xs text-gray-400 text-right">Last modified: {new Date(a.lastModified).toLocaleString()}</p>}
      </div>
    );
  };

  return (
    <div className="min-h-screen bg-gray-100">
      <header className="bg-gradient-to-r from-blue-800 to-blue-600 text-white p-3 shadow-lg">
        <div className="max-w-7xl mx-auto flex justify-between items-center">
          <div>
            <h1 className="text-xl font-bold">ISO 27001:2022 QA Audit Tool</h1>
            <p className="text-blue-200 text-sm">AI-Powered • Auto-Save • Levels 0-4</p>
          </div>
          <div className="flex items-center gap-3">
            {saveStatus && <span className="text-green-300 text-sm animate-pulse">{saveStatus}</span>}
            <button onClick={() => setShowSavePanel(!showSavePanel)} className="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded text-sm">💾 Save/Load</button>
          </div>
        </div>
      </header>

      {showSavePanel && (
        <div className="bg-white border-b shadow">
          <div className="max-w-7xl mx-auto p-3 flex flex-wrap gap-2">
            <button onClick={exportJSON} className="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">📥 Export JSON</button>
            <button onClick={exportCSV} className="bg-green-600 text-white px-4 py-2 rounded text-sm hover:bg-green-700">📊 Export CSV</button>
            <label className="bg-purple-600 text-white px-4 py-2 rounded text-sm hover:bg-purple-700 cursor-pointer">
              📤 Import JSON <input type="file" accept=".json" onChange={importJSON} className="hidden" />
            </label>
            <button onClick={clearAll} className="bg-red-600 text-white px-4 py-2 rounded text-sm hover:bg-red-700">🗑️ Clear All</button>
          </div>
        </div>
      )}

      <nav className="bg-white border-b shadow-sm sticky top-0 z-10">
        <div className="max-w-7xl mx-auto flex gap-1 p-2">
          {['dashboard', 'clauses', 'annex'].map(t => (
            <button key={t} onClick={() => setActiveTab(t)}
              className={`px-4 py-2 rounded text-sm font-medium ${activeTab === t ? 'bg-blue-600 text-white' : 'text-gray-600 hover:bg-gray-100'}`}>
              {t === 'dashboard' ? '📊 Dashboard' : t === 'clauses' ? '📋 Clauses' : '🔒 Annex A'}
            </button>
          ))}
        </div>
      </nav>

      <main className="max-w-7xl mx-auto p-4">
        {activeTab === 'dashboard' && (
          <div className="space-y-4">
            <div className="bg-white rounded-lg border p-4">
              <h2 className="font-semibold mb-3">📋 Audit Information</h2>
              <div className="grid md:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-gray-500 mb-1">Organization Name</label>
                  <input type="text" placeholder="Enter organization name" className="w-full border rounded p-2 text-sm" value={auditInfo.organizationName} onChange={e => setAuditInfo(p => ({...p, organizationName: e.target.value}))} />
                </div>
                <div>
                  <label className="block text-xs text-gray-500 mb-1">Auditor Name</label>
                  <input type="text" placeholder="Enter auditor name" className="w-full border rounded p-2 text-sm" value={auditInfo.auditorName} onChange={e => setAuditInfo(p => ({...p, auditorName: e.target.value}))} />
                </div>
                <div>
                  <label className="block text-xs text-gray-500 mb-1">Audit Date</label>
                  <input type="date" className="w-full border rounded p-2 text-sm" value={auditInfo.auditDate} onChange={e => setAuditInfo(p => ({...p, auditDate: e.target.value}))} />
                </div>
                <div>
                  <label className="block text-xs text-gray-500 mb-1">Audit Scope</label>
                  <input type="text" placeholder="e.g., IT Department, Full Organization" className="w-full border rounded p-2 text-sm" value={auditInfo.auditScope} onChange={e => setAuditInfo(p => ({...p, auditScope: e.target.value}))} />
                </div>
              </div>
            </div>

            <div className="bg-white rounded-lg border p-4">
              <h2 className="font-semibold mb-2">🔑 Anthropic API Key (for AI Recommendations)</h2>
              <div className="flex gap-2">
                <input type="password" placeholder="sk-ant-..." className="flex-1 border rounded p-2 text-sm" value={apiKey} onChange={e => setApiKey(e.target.value)} />
                <span className={`px-3 py-2 rounded text-sm ${apiKey ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-400'}`}>{apiKey ? '✓ Connected' : 'Not set'}</span>
              </div>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div className="bg-white rounded-lg border p-4">
                <div className="text-sm text-gray-500">Total Controls</div>
                <div className="text-2xl font-bold text-blue-600">{allStats.total}</div>
              </div>
              <div className="bg-white rounded-lg border p-4">
                <div className="text-sm text-gray-500">Assessed</div>
                <div className="text-2xl font-bold text-green-600">{allStats.assessed}</div>
                <div className="text-xs text-gray-400">{((allStats.assessed/allStats.total)*100).toFixed(0)}% complete</div>
              </div>
              <div className="bg-white rounded-lg border p-4">
                <div className="text-sm text-gray-500">Average Score</div>
                <div className="text-2xl font-bold text-purple-600">{allStats.avg.toFixed(2)}</div>
              </div>
              <div className="bg-white rounded-lg border p-4">
                <div className="text-sm text-gray-500">Level 3+ / Level 4</div>
                <div className="text-2xl font-bold text-blue-600">{allStats.l3} / {allStats.l4}</div>
              </div>
            </div>

            {/* Corrected Scoring Guide */}
            <div className="bg-white rounded-lg border p-4">
              <h3 className="font-semibold mb-3">📏 Scoring Guide</h3>
              <div className="space-y-4">
                <div className="grid md:grid-cols-3 gap-3">
                  <div className="p-3 bg-gray-50 rounded border">
                    <div className="font-bold text-red-600">Level 0</div>
                    <div className="text-sm text-gray-600">Non-Existent - No control</div>
                  </div>
                  <div className="p-3 bg-gray-50 rounded border">
                    <div className="font-bold text-orange-600">Level 1</div>
                    <div className="text-sm text-gray-600">Initial - Ad-hoc, undocumented</div>
                  </div>
                  <div className="p-3 bg-gray-50 rounded border">
                    <div className="font-bold text-yellow-600">Level 2</div>
                    <div className="text-sm text-gray-600">Developing - Partially documented</div>
                  </div>
                </div>
                
                <div className="p-3 bg-yellow-50 rounded border border-yellow-200">
                  <div className="font-bold text-yellow-700 mb-2">Level 3 Criteria (+0.25 each, unlocks at Level 2)</div>
                  <ul className="text-sm text-gray-700 space-y-1">
                    <li>✓ Control is defined with justifications of its requirement</li>
                    <li>✓ Policy and/or procedure formalized</li>
                    <li>✓ The control is systematically repeatable and measurable across all applicable assets</li>
                    <li>✓ Full execution and improvement cycle with reporting and action plans</li>
                  </ul>
                  <div className="text-xs text-yellow-700 mt-2">Score: 2.00 → 2.25 → 2.50 → 2.75 → 3.00</div>
                </div>

                <div className="p-3 bg-green-50 rounded border border-green-200">
                  <div className="font-bold text-green-700 mb-2">Level 4 Criteria (+0.25 each, unlocks when all L3 met)</div>
                  <ul className="text-sm text-gray-700 space-y-1">
                    <li>✓ Performance and effectiveness evaluation of the control is formalised and executed</li>
                    <li>✓ A control evaluation strategy is formalized</li>
                    <li>✓ Monitoring of the control is systematically performed across assets</li>
                    <li>✓ Improvement cycle with root cause analysis</li>
                  </ul>
                  <div className="text-xs text-green-700 mt-2">Score: 3.00 → 3.25 → 3.50 → 3.75 → 4.00</div>
                </div>
              </div>
            </div>
          </div>
        )}

        {activeTab === 'clauses' && (
          <div className="grid md:grid-cols-2 gap-4">
            <div>
              <h2 className="font-semibold mb-3">ISMS Clauses 4-10 ({clausesData.length} requirements)</h2>
              <div className="max-h-[70vh] overflow-y-auto pr-2 scrollbar-thin">
                {clausesData.map(ctrl => (
                  <ControlCard key={ctrl.id} ctrl={ctrl} 
                    isSelected={selectedControlId === ctrl.id}
                    score={calculateScore(ctrl.id)}
                    hasEvidence={!!(assessments[ctrl.id]?.evidenceNotes || assessments[ctrl.id]?.evidenceFiles)}
                    onSelect={setSelectedControlId}
                  />
                ))}
              </div>
            </div>
            <div className="sticky top-20 max-h-[80vh] overflow-y-auto scrollbar-thin">
              <AssessmentPanel />
            </div>
          </div>
        )}

        {activeTab === 'annex' && (
          <div className="grid md:grid-cols-2 gap-4">
            <div>
              <div className="flex justify-between items-center mb-3">
                <h2 className="font-semibold">Annex A Controls ({filteredAnnex.length})</h2>
                <select className="border rounded px-2 py-1 text-sm" value={filterTheme} onChange={e => setFilterTheme(e.target.value)}>
                  <option value="all">All Themes</option>
                  <option value="Organizational">A.5 Organizational (37)</option>
                  <option value="People">A.6 People (8)</option>
                  <option value="Physical">A.7 Physical (14)</option>
                  <option value="Technological">A.8 Technological (34)</option>
                </select>
              </div>
              <div className="max-h-[70vh] overflow-y-auto pr-2 scrollbar-thin">
                {filteredAnnex.map(ctrl => (
                  <ControlCard key={ctrl.id} ctrl={ctrl} 
                    isSelected={selectedControlId === ctrl.id}
                    score={calculateScore(ctrl.id)}
                    hasEvidence={!!(assessments[ctrl.id]?.evidenceNotes || assessments[ctrl.id]?.evidenceFiles)}
                    onSelect={setSelectedControlId}
                  />
                ))}
              </div>
            </div>
            <div className="sticky top-20 max-h-[80vh] overflow-y-auto scrollbar-thin">
              <AssessmentPanel />
            </div>
          </div>
        )}
      </main>

      <footer className="bg-gray-800 text-gray-400 p-3 mt-8 text-center text-sm">
        ISO 27001:2022 QA Audit Tool v4.0 • Scoring: 0-2 (Base) + L3 Criteria + L4 Criteria = Max 4.0
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
